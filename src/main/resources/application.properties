# Enable OpenAI
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.log-requests=true
quarkus.langchain4j.openai.log-responses=true

# Brave Search MCP server
quarkus.langchain4j.mcp.brave-search.transport-type=stdio
quarkus.langchain4j.mcp.brave-search.command=npx,-y,@anthropic-ai/mcp-server-brave-search
quarkus.langchain4j.mcp.brave-search.environment.BRAVE_API_KEY=${BRAVE_API_KEY}